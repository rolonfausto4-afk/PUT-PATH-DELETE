<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrar Usuario</title>
        <link rel="stylesheet" href="../CSS/Estilos.css">
    </head>
    <body>
        <form class="Formulario" >
            <h2 class="Formulario__Titulo">Registro de Usuario</h2>

            <label for="Nombre">Nombre Usuario</label>
            <input class="Formulario__Input" type="text" id="Nombre" name="Nombre" required placeholder="Aplique su Nombre Aqui">

            <label for="Correo">Correo</label>
            <input class="Formulario__Input" type="text" id="Correo" name="Correo" required placeholder="Aplique su Correo Aqui">

            <input type="submit" name="Enviar" class="Formulario__Input Input--Enviar" value="Enviar">
        </form>
    </body>

    <script type="module" src="../JS/App.js"></script>
</html>
